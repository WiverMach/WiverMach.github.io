<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Bryan's Café</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="stylesContact.css">
</head>

<body>
    <!-- Header -->
    <header>
        <div class="container">
            <a href="about.html">
                <img src="elements/logobryan.png" alt="Bryan's Café Logo" class="nav-logo">
            </a>
            <div class="burger-menu" id="burgerMenu">
                &#9776; <!-- Burger Icon -->
            </div>
            <nav id="navLinks">
                <ul>
                    <li><a href="about.html">About</a></li>
                    <li><a href="menu.html">Menu</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Enquiry Form -->
        <section class="enquiry-form">
            <h2>Send Us a Message</h2>
            <form id="contactForm">
                <div class="form-group">
                    <label for="firstName">First Name:</label>
                    <input type="text" id="firstName" name="firstName" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name:</label>
                    <input type="text" id="lastName" name="lastName" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="subject">Message Subject:</label>
                    <input type="text" id="subject" name="subject" required>
                </div>
                <div class="form-group">
                    <label for="message">Message Body:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <button type="submit">Submit</button>
            </form>
        </section>

        <!-- Branches Section -->
        <section class="branches">
            <h2>Our Branches</h2>
            <div id="branches-container">
                <!-- Dynamic branch information will be displayed here -->
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        &copy; <span id="year"></span> Bryan's Café | <a href="privacy.html">Privacy Policy</a>
    </footer>

    <!-- JavaScript -->
    <script>
        // Set current year
        document.getElementById('year').textContent = new Date().getFullYear();

        // Burger menu functionality
        const burgerMenu = document.getElementById('burgerMenu');
        const navLinks = document.getElementById('navLinks');
        burgerMenu.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });

        // Handle form submission
        document.getElementById('contactForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert("Your message has been sent!");
            document.getElementById('contactForm').reset();
        });
        
        // Fetch and display branch information with embedded maps
        fetch('xml/branches.xml')
        .then(response => response.text())
        .then(data => {
            const parser = new DOMParser();
            const xml = parser.parseFromString(data, "application/xml");

            const branches = xml.getElementsByTagName("branch");
            let branchesHTML = "";
            for (let branch of branches) {
                const name = branch.getElementsByTagName("name")[0].textContent;
                const address = branch.getElementsByTagName("address")[0].textContent;
                const contact = branch.getElementsByTagName("contact")[0].textContent;
                const hours = branch.getElementsByTagName("hours")[0].textContent;
                const mapEmbed = branch.getElementsByTagName("map")[0].textContent;

                branchesHTML += `
                    <div class="branch">
                        <h3>${name}</h3>
                        <p><strong>Address:</strong> ${address}</p>
                        <p><strong>Contact:</strong> ${contact}</p>
                        <p><strong>Opening Hours:</strong> ${hours}</p>
                        <iframe 
                            src="${mapEmbed}" 
                            width="100%" 
                            height="200" 
                            style="border:0;" 
                            allowfullscreen="" 
                            loading="lazy"
                            referrerpolicy="no-referrer-when-downgrade">
                        </iframe>
                    </div>
                `;
            }
            document.getElementById("branches-container").innerHTML = branchesHTML;
            })
            .catch(error => console.error('Error fetching branches.xml:', error));
    </script>
</body>

</html>
